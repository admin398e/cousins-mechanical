# Cousins Mechanical — Cloudflare Worker config
#
# Deploy with:  npm run deploy      (runs the checks + build first)
# Tail logs:    npx wrangler tail

name = "cousins-mechanical"
main = "worker.js"
compatibility_date = "2024-11-01"

# Node built-ins the Worker may reach for. Safe to keep on.
compatibility_flags = ["nodejs_compat"]

# NOTE: do not add a [limits] cpu_ms block — CPU limits are a paid-plan feature
# and the deploy fails with error 100328 on the free plan.

# ---------------------------------------------------------------------------
# Static site
#
# Serves ./public — the built HTML pages, images, support.js and the tyre
# catalogue JSON. The Worker also reads the catalogue back through this binding
# (see tyreData() in worker.js), so `npm run build` must run before deploy or
# live tyre pricing will fall back to placeholders.
# ---------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"
# Unknown URLs get the branded public/404.html (with a real 404 status) instead
# of a bare Cloudflare error page. Generated by build.js from legal/404.html.
not_found_handling = "404-page"

# Run the Worker BEFORE serving a static asset.
#
# Without this, Cloudflare answers any request that matches a file in ./public
# directly and the fetch handler never executes. That silently broke two things
# in production while every local test passed:
#
#   1. admin.<domain>/ served the public marketing homepage, because the
#      hostname rewrite to /admin.html lives in the Worker — and so did
#      admin.<domain>/robots.txt, which returned the public "Allow: /" file
#      instead of the staff-only "Disallow: /".
#   2. No HTML page carried the security headers or HSTS. Only /api/* responses
#      did, because those are the only paths with no matching asset.
#
# The local suite cannot catch this: server.js is Express and has no concept of
# Cloudflare's asset precedence. test/prod-smoke.mjs checks it against the real
# deployment instead.
run_worker_first = true

# ---------------------------------------------------------------------------
# Custom domain — the Worker serves the site and the API on the real domain.
# The zone must already be on Cloudflare.
# ---------------------------------------------------------------------------
[[routes]]
pattern = "cousinsmechanicalservices.co.uk"
custom_domain = true

[[routes]]
pattern = "www.cousinsmechanicalservices.co.uk"
custom_domain = true

# Staff dashboard on its own hostname. Its root serves admin.html and the whole
# host is noindex (see the fetch handler). /admin.html on the main domain keeps
# working too, so existing links are unaffected.
[[routes]]
pattern = "admin.cousinsmechanicalservices.co.uk"
custom_domain = true

# ---------------------------------------------------------------------------
# Rate limiting
#
# The KV counters this code also keeps are NOT sufficient on their own: KV reads
# are cached at the edge for up to 60 seconds, so a counter incremented on
# request 1 still reads as zero on request 50. Production UAT confirmed it — 70
# rapid calls to the metered vehicle-lookup proxy never tripped the KV limit.
# That means the brute-force protection on the login routes was far weaker than
# it looked.
#
# This binding is backed by the same infrastructure as WAF rate limiting rules
# and counts accurately. It is per-Cloudflare-location rather than global, so
# the KV counters are kept as a second, account-scoped layer (an attacker
# spreading guesses across PoPs still hits the per-email limit).
# ---------------------------------------------------------------------------
[[ratelimits]]
name = "RL_AUTH"          # login, signup, password reset — credential guessing
namespace_id = "1001"

  [ratelimits.simple]
  # 12/min was too tight: it locked the owner out of his own dashboard for a
  # minute after ordinary testing, and `npm run smoke:prod` (which deliberately
  # fires 20 bad logins to prove the limiter works) burned the whole budget for
  # the runner's IP. 30/min still makes password guessing hopeless, and the
  # per-account KV counter (8 per 15 min) is the tighter of the two anyway.
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_LOOKUP"        # the metered UKVD / tyre-fitment proxies
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_WRITE"         # bookings, messages, driver GPS — outbound email/spam
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 60

# ---------------------------------------------------------------------------
# KV — customer accounts, sessions, bookings, drivers, inventory, live driver
# GPS, rate-limit counters and the GDPR audit log all live here.
#
# Create with:  npx wrangler kv namespace create CMS_KV
# then paste the returned id below. The id is not a secret.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CMS_KV"
id = "cdd61c6aa2564cfea5af8afc48f7e947"

# Runs hourly: WhatsApp appointment reminders (5pm London, day before) and the
# GDPR retention purge (03:00 London). Both decide internally whether to act.
[triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------------------
# SECRETS — set each with `npx wrangler secret put NAME`. Never commit values.
# See .env.example for what each one is and where to get it.
#
#   Required to run:
#     SESSION_PEPPER      password-hash pepper       (openssl rand -hex 32)
#     ADMIN_TOKEN         admin dashboard password   (openssl rand -hex 32)
#     OVERRIDE_TOKEN      owner master key / 2FA reset (openssl rand -hex 32)
#     SITE_URL            https://cousinsmechanicalservices.co.uk
#
#   Required to confirm a booking to a customer — EITHER email service:
#     RESEND_API_KEY      resend.com — free 3,000 emails/month
#     (or) TWILIO_SID + TWILIO_TOKEN, which Twilio Email signs in with too
#     MAIL_FROM           address on a domain verified with whichever is used
#     MAIL_PROVIDER       auto | resend | twilio — only the starting default;
#                         the live choice is a dashboard setting (System -> EMAIL)
#     GCAL_CLIENT_EMAIL   Google service-account email
#     GCAL_PRIVATE_KEY    service-account private key (PEM, keep the \n)
#     GCAL_CALENDAR_ID    calendar shared with that service account
#
#   Customer texts — pick ONE pair:
#     WHATSAPP_TOKEN + WHATSAPP_PHONE_ID     (cheaper)
#     TWILIO_SID + TWILIO_TOKEN + TWILIO_FROM
#     OWNER_PHONE         owner's mobile, E.164 — alerts on new messages
#
#   Number-plate lookup (site works without it, using a default tyre size):
#     UKVD_API_KEY        UK Vehicle Data Global
#     UKVD_BASE           only for a sandbox key
#     TIRE_API_KEY        tire.vdim.app fitment
#
#   Google sign-in (optional):
#     ADMIN_EMAILS        comma-separated admin Google accounts — REQUIRED if
#                         Google sign-in is on, or any customer who signs in
#                         could claim an admin session
#
#   Optional:
#     EXTRA_ORIGINS       extra browser origins allowed to call the API
# ---------------------------------------------------------------------------
